<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
IoT Energy Monitor
</title>


<link rel="stylesheet" href="style.css">


<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>


<body>


<h1>
⚡ IoT ENERGY MONITOR
</h1>


<p class="subtitle">
ESP32-S3 + PZEM-004T
</p>



<div class="container">


<div class="card status-card">

<h3>Status</h3>

<span id="status">
Menunggu data...
</span>

</div>



<div class="card">

<h3>Tegangan</h3>

<span id="tegangan">
0
</span>

<p>Volt (V)</p>

</div>




<div class="card">

<h3>Arus</h3>

<span id="arus">
0
</span>

<p>Ampere (A)</p>

</div>




<div class="card">

<h3>Daya</h3>

<span id="daya">
0
</span>

<p>Watt (W)</p>

</div>




<div class="card">

<h3>Energi</h3>

<span id="energi">
0
</span>

<p>kWh</p>

</div>




<div class="card">

<h3>Frekuensi</h3>

<span id="frekuensi">
0
</span>

<p>Hz</p>

</div>




<div class="card">

<h3>Power Factor</h3>

<span id="pf">
0
</span>

</div>



</div>



<div class="chart-box">


<h2>
Grafik Daya Real-Time
</h2>


<canvas id="grafikDaya"></canvas>


</div>




<script src="script.js"></script>


</body>


</html>
